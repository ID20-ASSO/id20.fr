<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page déplacée · ID20</title>
<!-- Ancienne adresse conservée : cette URL est indexée par les moteurs et peut
     figurer dans des liens externes. On indique la nouvelle adresse (canonical,
     que Google et Bing traitent comme une redirection permanente) et on renvoie
     immédiatement le visiteur. GitHub Pages ne permet pas de vraie 301. -->
<link rel="canonical" href="https://id20.fr/planning/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/planning/">
<script>location.replace("/planning/" + location.hash);</script>
</head>
<body>
<p>Cette page a une nouvelle adresse : <a href="/planning/">id20.fr/planning/</a></p>
</body>
</html>
